<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" role="img">
<title>Quad reduction: every lane gets the row result</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
