<rect x="645" y="345" width="130" height="58" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="710" y="380.46" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">{0,1,2,3}</text>
<text x="30" y="445" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Each set uses local t = 0, 1, 2, 3; its global lane is 4g+t.</text>
<text x="30" y="470" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Each lane first reduces 16 values: 2 columns × 8 n-tiles (64 values per quad).</text>
<text x="30" y="495" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Vertical arrows show state progression; XOR exchanges with the peer t XOR mask.</text>
