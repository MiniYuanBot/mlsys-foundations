<text x="620" y="336.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">Compiler: thread map, smem, vectors</text>
<text x="620" y="360.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">Boundary: offsets &lt; n</text>
<text x="30" y="420" font-size="17" font-weight="400" text-anchor="start" fill="#526579">In Triton you still choose BLOCK, grid and dataflow. Eight cells illustrate a block.</text>
