<svg xmlns="http://www.w3.org/2000/svg" width="840" height="675" viewBox="0 0 840 675" role="img">
<title>Star all-reduce: serial root, six messages</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="675" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">Star all-reduce: serial root, six messages</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">P=4 · n bytes per rank · reduce by sum, then broadcast the result</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<text x="280" y="120" font-size="18" font-weight="700" text-anchor="middle" fill="#163047">rank 0</text>
<text x="425" y="120" font-size="18" font-weight="700" text-anchor="middle" fill="#163047">rank 1</text>
<text x="570" y="120" font-size="18" font-weight="700" text-anchor="middle" fill="#163047">rank 2</text>
<text x="715" y="120" font-size="18" font-weight="700" text-anchor="middle" fill="#163047">rank 3</text>
<text x="30" y="173" font-size="17" font-weight="700" text-anchor="start" fill="#163047">Initial</text>
<rect x="215" y="145" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="173.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a</text>
<rect x="360" y="145" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="173.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">b</text>
<rect x="505" y="145" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="173.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<rect x="650" y="145" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="173.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="237" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r1 → r0: b</text>
<rect x="215" y="209" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="237.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b</text>
<rect x="360" y="209" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="237.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">b</text>
<rect x="505" y="209" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="237.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<rect x="650" y="209" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="237.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="301" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r2 → r0: c</text>
<rect x="215" y="273" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="301.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c</text>
<rect x="360" y="273" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="301.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">b</text>
<rect x="505" y="273" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="301.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<rect x="650" y="273" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="301.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="365" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r3 → r0: d</text>
<rect x="215" y="337" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="365.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="360" y="337" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="365.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">b</text>
<rect x="505" y="337" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="365.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<rect x="650" y="337" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="365.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="429" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r0 → r1: sum</text>
<rect x="215" y="401" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="429.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="360" y="401" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="429.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="505" y="401" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="429.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<rect x="650" y="401" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="429.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="493" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r0 → r2: sum</text>
<rect x="215" y="465" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="280" y="493.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="360" y="465" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="425" y="493.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="505" y="465" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="570" y="493.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="650" y="465" width="130" height="45" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="715" y="493.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">d</text>
<text x="30" y="557" font-size="17" font-weight="700" text-anchor="start" fill="#163047">r0 → r3: sum</text>
<rect x="215" y="529" width="130" height="45" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="280" y="557.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="360" y="529" width="130" height="45" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="425" y="557.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="505" y="529" width="130" height="45" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="570" y="557.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<rect x="650" y="529" width="130" height="45" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="715" y="557.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">a+b+c+d</text>
<text x="30" y="620" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Each row follows one completed n-byte message; root receives/adds in rows 1–3.</text>
<text x="30" y="645" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Then root sends the full sum to each peer: T = 2(P−1)(α + nβ), ignoring reduction cost.</text>
</svg>
