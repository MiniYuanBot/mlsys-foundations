<text x="229.5" y="359.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r0</text>
<text x="229.5" y="382.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">a</text>
<rect x="281" y="333" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="325.5" y="359.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r1</text>
<text x="325.5" y="382.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">b</text>
<rect x="377" y="333" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="421.5" y="359.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r2</text>
<text x="421.5" y="382.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">c</text>
<line x1="475" y1="365" x2="515" y2="365" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="365" x2="506.896" y2="368.915" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="365" x2="506.896" y2="361.085" stroke="#526579" stroke-width="2"/>
<rect x="530" y="333" width="280" height="65" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="670" y="371.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">every rank: [a+b+c]</text>
<text x="30" y="463" font-size="17" font-weight="700" text-anchor="start" fill="#163047">Reduce-scatter</text>
<rect x="185" y="427" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="229.5" y="453.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r0</text>
<text x="229.5" y="476.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">a0 a1 a2</text>
<rect x="281" y="427" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="325.5" y="453.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r1</text>
<text x="325.5" y="476.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">b0 b1 b2</text>
<rect x="377" y="427" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="421.5" y="453.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r2</text>
<text x="421.5" y="476.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">c0 c1 c2</text>
<line x1="475" y1="459" x2="515" y2="459" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="459" x2="506.896" y2="462.915" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="459" x2="506.896" y2="455.085" stroke="#526579" stroke-width="2"/>
<rect x="530" y="427" width="280" height="65" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="670" y="465.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">r0: [s0]; r1: [s1]; r2: [s2]</text>
<text x="30" y="557" font-size="17" font-weight="700" text-anchor="start" fill="#163047">All-gather</text>
<rect x="185" y="521" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="229.5" y="547.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r0</text>
<text x="229.5" y="570.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">x0</text>
<rect x="281" y="521" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="325.5" y="547.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r1</text>
<text x="325.5" y="570.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">x1</text>
<rect x="377" y="521" width="89" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="421.5" y="547.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">r2</text>
<text x="421.5" y="570.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">x2</text>
<line x1="475" y1="553" x2="515" y2="553" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="553" x2="506.896" y2="556.915" stroke="#526579" stroke-width="2"/>
<line x1="515" y1="553" x2="506.896" y2="549.085" stroke="#526579" stroke-width="2"/>
<rect x="530" y="521" width="280" height="65" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="670" y="559.28" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">every rank: [x0 x1 x2]</text>
<text x="30" y="630" font-size="17" font-weight="400" text-anchor="start" fill="#526579">s_i = a_i + b_i + c_i. All-gather concatenates chunks; it does not sum them.</text>
<text x="30" y="655" font-size="17" font-weight="400" text-anchor="start" fill="#526579">“—” denotes no input. Reduce specifies the result at the root only.</text>
</svg>
