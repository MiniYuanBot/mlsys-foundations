<svg xmlns="http://www.w3.org/2000/svg" width="840" height="570" viewBox="0 0 840 570" role="img">
<title>Recursive doubling: exchange round-start buffers</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="570" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">Recursive doubling: exchange round-start buffers</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">P=4 · sum reduction · each message carries the full n-byte buffer</text>
