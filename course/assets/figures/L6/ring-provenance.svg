<text x="132" y="536.78" font-size="17" font-weight="400" text-anchor="middle" fill="#163047">complete chunk 0</text>
<text x="30" y="601" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Orange arrows carry partial sums; the receiver adds its own chunk-0 contribution.</text>
<text x="30" y="626" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Send rule: (r−s−1) mod 4. Other chunks follow rotated routes (see next figure).</text>
