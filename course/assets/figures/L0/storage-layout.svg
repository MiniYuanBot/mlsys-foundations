<text x="30" y="315" font-size="17" font-weight="400" text-anchor="start" fill="#526579">strides = [3, 1], offset = 0      index(i, j) = 3i + j</text>
<text x="30" y="340" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Values happen to equal indices in this six-element example.</text>
