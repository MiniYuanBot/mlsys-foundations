<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img">
<title>CPU core and GPU SM: different priorities</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="440" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">CPU core and GPU SM: different priorities</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">Source-reported examples · GPU resources below refer to Ada</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<rect x="45" y="110" width="350" height="60" rx="7" fill="#fff0da" stroke="#a45b0b"/>
<text x="220" y="133.3" font-size="20" font-weight="400" text-anchor="middle" fill="#163047">CPU core</text>
<text x="220" y="160.3" font-size="20" font-weight="400" text-anchor="middle" fill="#163047">Latency-oriented</text>
<rect x="440" y="110" width="350" height="60" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="615" y="133.3" font-size="20" font-weight="400" text-anchor="middle" fill="#163047">GPU SM (Ada example)</text>
<text x="615" y="160.3" font-size="20" font-weight="400" text-anchor="middle" fill="#163047">Throughput-oriented</text>
<text x="60" y="210" font-size="18" font-weight="400" text-anchor="start" fill="#163047">Control + out-of-order execution</text>
<text x="455" y="210" font-size="18" font-weight="400" text-anchor="start" fill="#163047">4 warp schedulers</text>
<text x="60" y="248" font-size="18" font-weight="400" text-anchor="start" fill="#163047">Large caches</text>
<text x="455" y="248" font-size="18" font-weight="400" text-anchor="start" fill="#163047">128 FP32 lanes + 4 Tensor Cores</text>
<text x="60" y="286" font-size="18" font-weight="400" text-anchor="start" fill="#163047">1–2 hardware threads</text>
<text x="455" y="286" font-size="18" font-weight="400" text-anchor="start" fill="#163047">64K registers; up to 1536 threads</text>
<text x="60" y="324" font-size="18" font-weight="400" text-anchor="start" fill="#163047">A few wide SIMD units</text>
<text x="455" y="324" font-size="18" font-weight="400" text-anchor="start" fill="#163047">100 KB shared memory (+ L1)</text>
<text x="30" y="390" font-size="17" font-weight="400" text-anchor="start" fill="#526579">RTX 4060 Laptop: 24 SMs. Other architectures have different per-SM limits.</text>
<text x="30" y="415" font-size="17" font-weight="400" text-anchor="start" fill="#526579">These capacities are source examples, not device measurements from this run.</text>
</svg>
