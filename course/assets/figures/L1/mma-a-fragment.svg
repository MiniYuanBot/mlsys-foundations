<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img">
<title>A fragment: four registers per lane</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="470" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">A fragment: four registers per lane</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">Derived mapping · g = lane // 4, t = lane % 4</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<rect x="70" y="155" width="330" height="90" rx="7" fill="#fff0da" stroke="#a45b0b"/>
<text x="235" y="193.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">block 0 / a[0]</text>
<text x="235" y="218.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">row g; cols 2t, 2t+1</text>
<rect x="425" y="155" width="330" height="90" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="590" y="193.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">block 2 / a[2]</text>
<text x="590" y="218.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">row g; cols 2t+8, 2t+9</text>
<rect x="70" y="270" width="330" height="90" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="235" y="308.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">block 1 / a[1]</text>
<text x="235" y="333.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">row g+8; cols 2t, 2t+1</text>
<rect x="425" y="270" width="330" height="90" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="590" y="308.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">block 3 / a[3]</text>
<text x="590" y="333.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">row g+8; cols 2t+8, 2t+9</text>
<text x="235" y="125" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">columns 0–7</text>
<text x="590" y="125" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">columns 8–15</text>
<text x="30" y="412" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Each register holds two fp16 values. Each lane holds 8 values in total.</text>
<text x="30" y="437" font-size="17" font-weight="400" text-anchor="start" fill="#526579">32 lanes × 8 values = 256 elements = a complete 16 × 16 A tile.</text>
</svg>
