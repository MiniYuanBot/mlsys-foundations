<svg xmlns="http://www.w3.org/2000/svg" width="840" height="485" viewBox="0 0 840 485" role="img">
<title>Padding: separate 32 lanes across 32 banks</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="485" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">Padding: separate 32 lanes across 32 banks</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">Derived FP32 model · column j = 0; 4-byte banks; distinct addresses</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<rect x="45" y="110" width="355" height="65" rx="7" fill="#fff0da" stroke="#a45b0b"/>
<text x="222.5" y="135.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">float tile[32][32]</text>
<text x="222.5" y="161.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">bank(r) = (32r + j) mod 32</text>
<text x="45" y="210" font-size="18" font-weight="400" text-anchor="start" fill="#163047">Lane groups reading one column:</text>
