<text x="45" y="505" font-size="17" font-weight="400" text-anchor="start" fill="#163047">Relative sector IDs = 128i; 28 other accessed sectors omitted (lanes 3–30).</text>
<text x="45" y="535" font-size="17" font-weight="400" text-anchor="start" fill="#163047">Each sector: 4 B useful + 28 B unused. Address gaps are not to scale.</text>
<text x="30" y="575" font-size="17" font-weight="400" text-anchor="start" fill="#526579">32 × 32 B = 1024 B transferred / 128 B useful = 8× traffic, not 8× latency.</text>
