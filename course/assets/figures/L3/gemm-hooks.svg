<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img">
<title>GEMM template: generated hooks at the boundary</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="500" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">GEMM template: generated hooks at the boundary</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">Schematic · not to scale</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<rect x="45" y="115" width="300" height="65" rx="7" fill="#fff0da" stroke="#a45b0b"/>
<text x="195" y="140.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">A element</text>
<text x="195" y="166.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">generated prologue</text>
<rect x="490" y="115" width="300" height="65" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="640" y="140.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">B element</text>
<text x="640" y="166.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">direct load</text>
<line x1="195" y1="188" x2="195" y2="225" stroke="#526579" stroke-width="2"/>
<line x1="195" y1="225" x2="191.085" y2="216.896" stroke="#526579" stroke-width="2"/>
<line x1="195" y1="225" x2="198.915" y2="216.896" stroke="#526579" stroke-width="2"/>
<line x1="640" y1="188" x2="640" y2="225" stroke="#526579" stroke-width="2"/>
<line x1="640" y1="225" x2="636.085" y2="216.896" stroke="#526579" stroke-width="2"/>
<line x1="640" y1="225" x2="643.915" y2="216.896" stroke="#526579" stroke-width="2"/>
<rect x="45" y="235" width="745" height="65" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
<text x="417.5" y="260.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">Fixed tiled GEMM template</text>
<text x="417.5" y="286.96" font-size="19" font-weight="400" text-anchor="middle" fill="#163047">load As / Bs → accumulate across K tiles</text>
<line x1="420" y1="310" x2="420" y2="340" stroke="#526579" stroke-width="2"/>
<line x1="420" y1="340" x2="416.085" y2="331.896" stroke="#526579" stroke-width="2"/>
<line x1="420" y1="340" x2="423.915" y2="331.896" stroke="#526579" stroke-width="2"/>
<rect x="170" y="350" width="500" height="60" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="420" y="386.8" font-size="20" font-weight="400" text-anchor="middle" fill="#163047">Generated epilogue → store output</text>
<text x="30" y="450" font-size="17" font-weight="400" text-anchor="start" fill="#526579">A prologue can repeat for every N tile; B-side fusion is not enabled in this lab.</text>
<text x="30" y="475" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Epilogue runs once per output element, after the complete K accumulation.</text>
</svg>
