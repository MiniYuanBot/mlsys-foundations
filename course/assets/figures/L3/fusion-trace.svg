<text x="282.5" y="261.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">Sub: x − m</text>
<text x="282.5" y="286.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">z: [R, C]</text>
