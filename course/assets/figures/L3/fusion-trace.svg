<text x="492.5" y="136.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">RowSum(e)</text>
<text x="492.5" y="161.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">l: [R, 1]</text>
