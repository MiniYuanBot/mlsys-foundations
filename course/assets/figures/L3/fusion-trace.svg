<text x="45" y="345" font-size="21" font-weight="700" text-anchor="start" fill="#163047">Reverse topological fusion into K0</text>
<rect x="45" y="365" width="145" height="34" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="117.5" y="388.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">Div</text>
<text x="215" y="389" font-size="19" font-weight="400" text-anchor="start" fill="#163047">Create Elementwise kernel</text>
<rect x="45" y="409" width="145" height="34" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="117.5" y="432.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">RowSum</text>
<text x="215" y="433" font-size="19" font-weight="400" text-anchor="start" fill="#163047">Join; K0 becomes Row</text>
<rect x="45" y="453" width="145" height="34" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="117.5" y="476.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">Exp</text>
<text x="215" y="477" font-size="19" font-weight="400" text-anchor="start" fill="#163047">Both consumers already in K0</text>
<rect x="45" y="497" width="145" height="34" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="117.5" y="520.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">Sub</text>
<text x="215" y="521" font-size="19" font-weight="400" text-anchor="start" fill="#163047">Join K0</text>
<rect x="45" y="541" width="145" height="34" rx="7" fill="#f0eafa" stroke="#7543a3"/>
<text x="117.5" y="564.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">RowMax</text>
<text x="215" y="565" font-size="19" font-weight="400" text-anchor="start" fill="#163047">Join; same reduction width C</text>
<text x="30" y="610" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Unfused: 5 kernels; temporaries m, z, e, l contain 2RC + 2R elements.</text>
<text x="30" y="635" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Fused: one kernel reads x and writes y. Example R=2, C=3: 16 temporary elements.</text>
