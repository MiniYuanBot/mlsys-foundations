<svg xmlns="http://www.w3.org/2000/svg" width="840" height="675" viewBox="0 0 840 675" role="img">
<title>Softmax fusion: dependencies and temporary shapes</title>
<desc>Technical teaching figure. The caption and editable source specify its assumptions.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,polyline{stroke-linecap:round;stroke-linejoin:round}</style>
<rect x="0" y="0" width="840" height="675" fill="#ffffff"/>
<text x="30" y="38" font-size="25" font-weight="700" text-anchor="start" fill="#163047">Softmax fusion: dependencies and temporary shapes</text>
<text x="30" y="66" font-size="16" font-weight="400" text-anchor="start" fill="#526579">Derived shapes · reduction outputs keep dimension 1; no new performance measurements</text>
<line x1="30" y1="82" x2="810" y2="82" stroke="#bccbd6" stroke-width="1"/>
<rect x="45" y="155" width="110" height="60" rx="7" fill="#e8f2fb" stroke="#1769aa"/>
