<text x="100" y="203.62" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">[R, C]</text>
<rect x="210" y="110" width="145" height="65" rx="7" fill="#fff0da" stroke="#a45b0b"/>
<text x="282.5" y="136.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">RowMax</text>
<text x="282.5" y="161.12" font-size="18" font-weight="400" text-anchor="middle" fill="#163047">m: [R, 1]</text>
