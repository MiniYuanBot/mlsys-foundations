<line x1="122" y1="284" x2="122" y2="295" stroke="#526579" stroke-width="2"/>
<line x1="320" y1="284" x2="320" y2="295" stroke="#526579" stroke-width="2"/>
<line x1="518" y1="284" x2="518" y2="295" stroke="#526579" stroke-width="2"/>
<line x1="716" y1="284" x2="716" y2="295" stroke="#526579" stroke-width="2"/>
<text x="30" y="410" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Each lane keeps 4 output accumulators; normalize by the row sum at the end.</text>
<text x="30" y="435" font-size="17" font-weight="400" text-anchor="start" fill="#526579">32 × 4 × 2 B = 256 B per K row. Repeat for each key via its paged address.</text>
