<text x="725" y="436.44" font-size="16" font-weight="400" text-anchor="middle" fill="#163047">mat: stale</text>
<rect x="155" y="500" width="540" height="48" rx="7" fill="#e3f4ef" stroke="#087f78"/>
<text x="425" y="531.14" font-size="21" font-weight="400" text-anchor="middle" fill="#163047">New output: on → the → rug (bonus)</text>
<text x="30" y="574" font-size="17" font-weight="400" text-anchor="start" fill="#526579">The bonus rug has no KV yet. Next round inputs rug and overwrites the stale mat slot.</text>
