<text x="30" y="448" font-size="17" font-weight="400" text-anchor="start" fill="#526579">mask[4] = {0,1,4}; mask[5] = {0,1,5}. Shared committed prefix is omitted.</text>
<text x="30" y="473" font-size="17" font-weight="400" text-anchor="start" fill="#526579">RoPE position = prefix_len + depth; KV slot = prefix_len + node ID.</text>
<text x="30" y="498" font-size="17" font-weight="400" text-anchor="start" fill="#526579">Siblings share a depth but have different KV slots. The full tree continues beyond node 5.</text>
